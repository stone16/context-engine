{% extends "base.html" %}
{% block content %}
<section class="state state-refusal" role="alert" aria-labelledby="refusal-title">
  <p class="eyebrow">Fail closed</p>
  <h1 id="refusal-title" tabindex="-1">Request refused</h1>
  <p>The operation did not establish the trusted context it requires.</p>
  <dl><div><dt>Category</dt><dd><code>{{ category }}</code></dd></div></dl>
  <a class="button button-secondary" href="{{ return_path }}">Return to form</a>
</section>
{% endblock %}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-engine"
version = "0.1.0"
description = "Permission-aware context delivery engine"
readme = "README.md"
license = "Apache-2.0"
license-files = [
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
  "THIRD_PARTY_SBOM.cyclonedx.json",
  "third_party/*/LICENSE*",
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<1.17",
  "cryptography>=49,<50",
  "fastapi>=0.116,<0.117",
  "jsonschema>=4.25,<5",
  "jinja2>=3.1,<3.2",
  "markdown>=3.6,<3.7",
  "pydantic>=2.13,<2.14",
  "psycopg[binary]>=3.2,<3.3",
  "rfc8785>=0.1.4,<0.2",
  "sentence-transformers>=5,<6",
  "sqlalchemy>=2.0,<2.1",
  "starlette>=0.48,<0.49",
  "uvicorn>=0.35,<0.36",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "hypothesis>=6,<7",
  "mypy>=1.17,<1.18",
  "pytest>=8.4,<8.5",
  "ruff>=0.12,<0.13",
  "types-jsonschema>=4.25,<5",
]

[project.scripts]
context-engine-api = "applications.api:main"
context-engine-control = "applications.control:main"
context-engine-dogfood-seed = "applications.dogfood:main"
context-engine-dogfood-eval = "applications.dogfood_evaluation:main"
context-engine-embedding-benchmark = "applications.embedding_benchmark:main"
context-engine-eval = "applications.eval_v1:main"
context-engine-file-scan-measurement = "applications.file_scan_measurement:main"
context-engine-golden-backup = "applications.golden_backup:main"
context-engine-local-context = "applications.local_context:main"
context-engine-worker = "applications.worker:main"
context-engine-connector-runner = "applications.connector_runner:main"

[tool.hatch.build.targets.wheel]
packages = [
  "engine",
  "adapters",
  "applications",
  "eval",
  "migrations",
  "third_party",
  "ui",
]

[tool.hatch.build.targets.wheel.force-include]
"eval/golden/v1/schema.json" = "eval/golden/v1/schema.json"
"eval/public-subset-governance.json" = "eval/public-subset-governance.json"
"eval/thresholds/v1.json" = "eval/thresholds/v1.json"
"LICENSE" = "LICENSE"
"NOTICE" = "NOTICE"
"THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md"
"THIRD_PARTY_SBOM.cyclonedx.json" = "THIRD_PARTY_SBOM.cyclonedx.json"

[tool.mypy]
python_version = "3.13"
strict = true
files = [
  "engine",
  "adapters",
  "applications",
  "eval",
  "migrations",
  "ui",
  "scripts/provision_database_roles.py",
  "scripts/third_party_governance.py",
  "scripts/wait_for_database.py",
  "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires the real PostgreSQL 17 + pgvector harness",
  "security_evidence(id, layer): exact executable M0 security evidence registration",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"third_party/**/*.py" = ["E501", "SIM103", "UP009", "UP032"]
